name: Review comparison layout
on: pull_request
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Inspect fresh example comparisons
        run: |
          npm run preview -- --port 4177 > /tmp/exercise-preview.log 2>&1 &
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          for (const width of [1280,360]) {
            const page = await browser.newPage({viewport:{width,height:width===360?800:850}});
            page.on('pageerror', e => console.log('PAGE ERROR', e.message));
            await page.goto('http://localhost:4177/',{waitUntil:'networkidle'});
            await page.evaluate(()=>document.fonts.ready);
            console.log('LAYOUT',width,JSON.stringify(await page.evaluate(()=>({body:document.body.scrollWidth,page:innerWidth,sections:[...document.querySelectorAll('h1,h2,.exercise-pair-picker,.comparison-grid,.movement-panel,.comparison-results')].filter(e=>e.getClientRects().length).slice(0,14).map(e=>[e.tagName,e.className,e.textContent.slice(0,60),e.getBoundingClientRect().top])}))));
            const png=await page.screenshot({type:'jpeg',quality:62,path:'comparison-'+width+'.jpg'});
            const data=png.toString('base64');
            for(let i=0;i<data.length;i+=4000)console.log('LAYOUTIMG'+width+' '+data.slice(i,i+4000));
            await page.getByRole('button',{name:'Search exercise A',exact:true}).click();
            await page.getByRole('searchbox',{name:'Find exercise A',exact:true}).fill('dumbbell curl');
            console.log('SEARCH',width,await page.locator('.pair-search-results').innerText());
            await page.close();
          }
          await browser.close();
          JS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: comparison-screenshots
          path: comparison-*.jpg
          retention-days: 1

  browser-groups:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --timeout=20000
